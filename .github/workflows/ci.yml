name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - name: Autopilot scripts must compile and run on Python 3.9 (the system python3 runs them)
        run: |
          for f in docs/autopilot/*.py; do uv run --python 3.9 --no-project python -m py_compile "$f"; done
          uv run --python 3.9 --no-project python docs/autopilot/lock.py --help
          uv run --python 3.9 --no-project python docs/autopilot/next_run.py --help
          uv run --python 3.9 --no-project python docs/autopilot/leakcheck.py --help
          uv run --python 3.9 --no-project python docs/autopilot/progress.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: LEARNING.md must never be committed
        run: test -z "$(git ls-files LEARNING.md)"
