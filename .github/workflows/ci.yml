name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Autopilot scripts must compile on Python 3.9 (the system python3 runs them)
        run: uv run --python 3.9 --no-project python -m py_compile docs/autopilot/lock.py docs/autopilot/next_run.py docs/autopilot/progress.py docs/autopilot/leakcheck.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: LEARNING.md must never be committed
        run: test -z "$(git ls-files LEARNING.md)"
