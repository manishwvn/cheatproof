# Builds the static report site from committed data and deploys it to GitHub Pages.
# No paid calls and no model calls: the build reads results/certificates/ and results/batch.json only.
# Deploy runs only when the build succeeded, on a public repo, and when Pages is enabled for the repo.
# A private repo skips deploy (same gate as the codeql job in security.yml). A repo with Pages disabled
# skips deploy with a notice (the "enable" check below reads HTTP 404), so no run fails for that reason.
# Any other failure, including a failed site build, fails the run and nothing is deployed.
name: pages
on:
  push:
    branches: [main]
  pull_request:  # build only; the deploy job never runs for a pull_request event
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - name: "Build the report site (output: results/site)"
        run: uv run python -m cheatproof.cli site --certs results/certificates --out results/site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: results/site
  deploy:
    if: ${{ !github.event.repository.private && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          err="$RUNNER_TEMP/pages-check.err"
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2> "$err"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" "$err"; then
            echo "::notice::GitHub Pages is not enabled for this repository; nothing was deployed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat "$err" >&2
            exit 1
          fi
      - id: deployment
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
