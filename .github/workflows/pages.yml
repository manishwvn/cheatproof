# Builds the static report site from committed data and deploys it to GitHub Pages.
# No paid calls and no model calls: the build reads results/certificates/ and results/batch.json only.
# The deploy job is skipped while the repo is private (same gate as the codeql job in security.yml), so
# this workflow does not fail on a private repo. Its continue-on-error also keeps a run from failing when
# Pages is not enabled yet: the deploy step then fails softly and the run still shows green.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - name: Build the report site (output: results/site)
        run: |
          set +e
          uv run python -m cheatproof.cli site --certs results/certificates --out results/site
          rc=$?
          set -e
          # Exit 1 means the site was written but a committed file did not load (an error row on the site).
          # Deploy in that case; any other failure stops the run.
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: results/site
  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
