[project]
name = "rewardseal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "contree-sdk==0.3.6",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
# Wake and progress scripts must stay Python 3.9 compatible (system python3 runs them).
extend-exclude = ["docs/autopilot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rewardseal"]
